version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        # The CLI regenerates .storyblok/types differently on most bumps, which
        # fails types:check. Alone in its own PR it cannot block the others.
        exclude-patterns: ['storyblok']
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the runtime major (node-version in ci.yml), not npm latest.
      # Bump both together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # eslint-plugin-react (via eslint-config-next) calls context.getFilename(), removed in
      # ESLint 10, so every lint run crashes. Drop once eslint-config-next supports v10.
      - dependency-name: 'eslint'
        versions: ['10.x']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
